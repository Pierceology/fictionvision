  <script>
    // iPhone and iPad only: Safari's focus zoom is switched off (pinch zoom still works there), and if a page is ever left zoomed in, the
    // next page change puts it back (2026-10-12, Pierce: "the board still moved around")
    (function () {
      var ios = /iPhone|iPad|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
      if (!ios) return;
      var m = document.querySelector('meta[name="viewport"]');
      var base = 'width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1';
      m.setAttribute('content', base);
      var reset = function () { if (window.visualViewport && window.visualViewport.scale > 1.02) { m.setAttribute('content', base + ', user-scalable=no'); setTimeout(function () { m.setAttribute('content', base); }, 60); } };
      window.addEventListener('hashchange', function () { setTimeout(reset, 80); });
      document.addEventListener('focusout', function () { setTimeout(reset, 200); });
    })();
  </script>
